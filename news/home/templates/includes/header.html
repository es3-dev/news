{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}News | Home{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'home/css/global.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap');
        @import url("https://db.onlinewebfonts.com/c/73c00071d90ecfb78bf0ccdeda529307?family=Nico+Moji");
    </style>
</head>
<body>
    
    <header class="header">

        <div class="title-container">
            <a href="/" class="title-news">NEWS</a>
        </div>

        <nav class="navigation">
            <ul class="ul-navigation">
                <li class="li-navigation">
                    <a href="" class="a-navigation">Inicio</a>
                </li>
                <li class="li-navigation">
                    <a href="" class="a-navigation">Tecnología</a>
                </li>
                <li class="li-navigation">
                    <a href="" class="a-navigation">Economía</a>
                </li>
                <li class="li-navigation">
                    <a href="" class="a-navigation">Entretenimiento</a>
                </li>
                <li class="li-navigation">
                    <a href="" class="a-navigation">Clima</a>
                </li>
            </ul>
        </nav>

        <div class="button-header-container">
            <button type="button" id="button-header-login" class="login" data-url="{% url 'login' %}">Login</button>
            <button type="button" id="button-header-sign-up" class="sign-up">Sign-up</button>
        </div>

    </header>

    {% block content %}
    {% endblock %}

    <script src="{% static 'home/js/index.js' %}"></script>
</body>
</html>
